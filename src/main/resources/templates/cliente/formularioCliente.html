<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <style>

    </style>
</head>
<body>
    <h1 style="text-align: center;">Cadastro de Clientes</h1>
    <form action="/clientes/salvar" method="post" th:object="${cliente}">

        <input type="hidden" name="idCliente" th:field="*{idCliente}">

        <div class="field">
            <input type="text" id="nomeCliente" name="nomeCliente" th:field="*{nomeCliente}" placeholder=" " required> 
            <label for="nomeCliente">Nome</label>
        </div>

        <div class="field">
            <input type="email" id="emailCliente" name="emailCliente" th:field="*{emailCliente}" placeholder=" " required>
            <label for="emailCliente">Email</label>
        </div> 

        <div class="field">
            <input type="text" id="telefoneCliente" name="telefoneCliente" th:field="*{telefoneCliente}" placeholder=" " required> 
            <label for="telefoneCliente">Telefone</label>
        </div>

        <div class="field">
            <input type="text" id="cpfCliente" name="telefoneCliente" th:field="*{cpfCliente}" placeholder=" " required>
            <label for="cpfCliente">CPF</label>
        </div>

        <div style="margin-bottom:18px;">
            <label style="display:block;margin-bottom:8px;color:var(--muted);font-size:13px">Endereço</label>
            <div class="cep-row">
              <div class="field">
                <input type="text" id="cep" name="cepPaciente" th:field="*{cepPaciente}" placeholder=" " required />
                <label for="cep">CEP</label>
              </div>
              <button type="button" class="btn-lookup" id="btn-cep">Buscar</button>
            </div>
          </div>
  
          <div class="field"><input type="text" id="rua" name="ruaPaciente" th:field="*{ruaPaciente}" placeholder=" " /><label for="rua">Rua</label></div>
          <div class="field"><input type="text" id="bairro" name="bairroPaciente" th:field="*{bairroPaciente}" placeholder=" " /><label for="bairro">Bairro</label></div>
          <div style="display:flex;gap:12px;">
            <div style="flex:1"><div class="field"><input type="text" id="cidade" name="cidadePaciente" th:field="*{cidadePaciente}" placeholder=" " /><label for="cidade">Cidade</label></div></div>
            <div style="width:120px"><div class="field"><input type="text" id="uf" name="ufPaciente" th:field="*{ufPaciente}" placeholder=" " /><label for="uf">Estado</label></div></div>
        </div>
  
          <input type="hidden" id="ibge" name="ibgePaciente" th:field="*{ibgePaciente}" /> 
          
        <div class="actions">
            <button type="submit">Salvar</button>
            <a href="/clientes" class="btn-back">Voltar</a>
        </div>
    </form>
</body>
</html>
